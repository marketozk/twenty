name: Omnichannel fork migration transactions

on:
  pull_request:
    paths:
      - 'packages/twenty-server/src/database/commands/fork-upgrade/**'
      - 'packages/twenty-server/src/engine/core-modules/omnichannel-storage/**'
      - 'packages/twenty-server/src/engine/core-modules/crm-audit/**'
      - 'packages/twenty-server/src/modules/omnichannel/**'
      - 'packages/twenty-server/test/fork-migration/**'
      - 'packages/twenty-server/jest-fork-migration.config.mjs'
      - '.github/workflows/omnichannel-fork-migrations.yaml'
      - 'yarn.lock'
      - 'scripts/omnichannel/*fork_migration_sources.py'
      - 'scripts/omnichannel/test_startup_scripts.py'
      - 'ops/omnichannel/**'
      - 'packages/twenty-docker/twenty/Dockerfile'
      - 'packages/twenty-server/src/database/commands/cron-register-all.command.ts'
      - 'packages/twenty-server/src/database/commands/__tests__/cron-register-all.command.spec.ts'
      - 'packages/twenty-server/src/engine/core-modules/cache-storage/commands/**'
      - 'packages/twenty-server/src/engine/core-modules/upgrade/commands/**'
  push:
    branches: ['codex/**']
    paths:
      - 'packages/twenty-server/src/database/commands/fork-upgrade/**'
      - 'packages/twenty-server/src/engine/core-modules/omnichannel-storage/**'
      - 'packages/twenty-server/src/engine/core-modules/crm-audit/**'
      - 'packages/twenty-server/src/modules/omnichannel/**'
      - 'packages/twenty-server/test/fork-migration/**'
      - 'packages/twenty-server/jest-fork-migration.config.mjs'
      - '.github/workflows/omnichannel-fork-migrations.yaml'
      - 'yarn.lock'
      - 'scripts/omnichannel/*fork_migration_sources.py'
      - 'scripts/omnichannel/test_startup_scripts.py'
      - 'ops/omnichannel/**'
      - 'packages/twenty-docker/twenty/Dockerfile'
      - 'packages/twenty-server/src/database/commands/cron-register-all.command.ts'
      - 'packages/twenty-server/src/database/commands/__tests__/cron-register-all.command.spec.ts'
      - 'packages/twenty-server/src/engine/core-modules/cache-storage/commands/**'
      - 'packages/twenty-server/src/engine/core-modules/upgrade/commands/**'

permissions:
  contents: read

jobs:
  postgres-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U test_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify generated migration source integrity
        run: |
          python3 -m unittest discover -s scripts/omnichannel -p 'test_fork_migration_sources.py' -v
          python3 scripts/omnichannel/check_fork_migration_sources.py
          python3 -m unittest discover -s scripts/omnichannel -p 'test_startup_scripts.py' -v
      - uses: ./.github/actions/yarn-install
      - name: Verify strict migration command behavior
        run: >-
          node .yarn/releases/yarn-4.18.1.cjs jest --config packages/twenty-server/jest.config.mjs --runInBand --runTestsByPath
          packages/twenty-server/src/database/commands/__tests__/cron-register-all.command.spec.ts
          packages/twenty-server/src/engine/core-modules/cache-storage/commands/__tests__/flush-cache.command.spec.ts
          packages/twenty-server/src/engine/core-modules/upgrade/commands/__tests__/upgrade-status.command.spec.ts
      - name: Create a dedicated disposable test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          test_database="twenty_rob764_test_$(openssl rand -hex 8)"
          docker exec "$POSTGRES_CONTAINER" createdb -U test_owner "$test_database"
          echo "FORK_MIGRATION_TEST_URL=postgres://test_owner:isolated-test-only@127.0.0.1:${POSTGRES_PORT}/${test_database}" >> "$GITHUB_ENV"
      - name: Verify migration transactions without application reset
        run: node .yarn/releases/yarn-4.18.1.cjs jest --config packages/twenty-server/jest-fork-migration.config.mjs --runInBand
